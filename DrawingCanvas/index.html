<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krita-Style Web Drawing Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Toolbar Styling */
    #sidebar {
      width: 280px;
      background-color: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
      z-index: 10;
      overflow-y: auto;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      color: #007acc;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #2d2d2d;
      padding: 10px;
      border-radius: 6px;
    }

    label {
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"], input[type="color"] {
      width: 100%;
      cursor: pointer;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button {
      background-color: #3c3c3c;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #4a4a4a;
    }

    button.active {
      background-color: #007acc;
      border-color: #0098ff;
    }

    /* Layer Controls */
    #layer-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 150px;
      overflow-y: auto;
      background: #1e1e1e;
      padding: 5px;
      border-radius: 4px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #2d2d2d;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .layer-item.active {
      border: 1px solid #007acc;
      background: #37373d;
    }

    /* Canvas Work Area */
    #canvas-container {
      flex: 1;
      position: relative;
      background-color: #121212;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Left Sidebar Controls -->
  <div id="sidebar">
    <div class="section-title">Tools</div>
    <div class="btn-group">
      <button id="tool-brush" class="active">Brush</button>
      <button id="tool-eraser">Eraser</button>
      <button id="tool-pan">Pan / Move</button>
      <button id="btn-reset-view">Reset View</button>
    </div>

    <div class="section-title">Brush Settings</div>
    <div class="control-group">
      <label>Color</label>
      <input type="color" id="brush-color" value="#000000">
      
      <label>Size: <span id="val-size">10</span>px</label>
      <input type="range" id="brush-size" min="1" max="100" value="10">
      
      <label>Opacity: <span id="val-opacity">100</span>%</label>
      <input type="range" id="brush-opacity" min="1" max="100" value="100">

      <label style="margin-top: 5px;">
        <span>Pen Pressure Sensitivity</span>
        <input type="checkbox" id="enable-pressure" checked>
      </label>
    </div>

    <div class="section-title">Layers</div>
    <div class="control-group">
      <div class="btn-group">
        <button id="btn-add-layer">+ Add</button>
        <button id="btn-del-layer">- Delete</button>
      </div>
      <div id="layer-list"></div>
    </div>

    <div class="section-title">Actions</div>
    <div class="control-group">
      <button id="btn-clear" style="background: #a22;">Clear Active Layer</button>
      <button id="btn-export" style="background: #28a745;">Export PNG</button>
    </div>
  </div>

  <!-- Main Drawing Viewport -->
  <div id="canvas-container">
    <div id="viewport"></div>
  </div>
</div>

<script>
  // App Canvas Setup
  const CANVAS_WIDTH = 1920;
  const CANVAS_HEIGHT = 1080;

  const container = document.getElementById('canvas-container');
  const viewport = document.getElementById('viewport');
  const layerListEl = document.getElementById('layer-list');

  // State Variables
  let layers = [];
  let activeLayerIndex = -1;
  let currentTool = 'brush'; // 'brush', 'eraser', 'pan'
  let isDrawing = false;
  let isPanning = false;

  // Transform / Zoom / Pan state
  let scale = 1;
  let panX = 0;
  let panY = 0;
  let startPanX = 0;
  let startPanY = 0;

  // Pointer position tracking
  let lastX = 0;
  let lastY = 0;

  // Initialize Canvas Viewport Size
  viewport.style.width = CANVAS_WIDTH + 'px';
  viewport.style.height = CANVAS_HEIGHT + 'px';

  // Center Canvas on Startup
  function centerCanvas() {
    const rect = container.getBoundingClientRect();
    scale = Math.min((rect.width - 80) / CANVAS_WIDTH, (rect.height - 80) / CANVAS_HEIGHT);
    panX = (rect.width - CANVAS_WIDTH * scale) / 2;
    panY = (rect.height - CANVAS_HEIGHT * scale) / 2;
    updateTransform();
  }

  function updateTransform() {
    viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  // --- Layer Management ---
  function createLayer(name = `Layer ${layers.length + 1}`) {
    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    viewport.appendChild(canvas);

    const layer = { id: Date.now(), name, canvas, ctx, visible: true };
    layers.push(layer);
    setActiveLayer(layers.length - 1);
    renderLayerUI();

    // Fill first layer with white background
    if (layers.length === 1) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
  }

  function setActiveLayer(index) {
    if (index >= 0 && index < layers.length) {
      activeLayerIndex = index;
      renderLayerUI();
    }
  }

  function renderLayerUI() {
    layerListEl.innerHTML = '';
    for (let i = layers.length - 1; i >= 0; i--) {
      const item = document.createElement('div');
      item.className = `layer-item ${i === activeLayerIndex ? 'active' : ''}`;
      item.innerText = layers[i].name;
      item.onclick = () => setActiveLayer(i);
      layerListEl.appendChild(item);
    }
  }

  document.getElementById('btn-add-layer').onclick = () => createLayer();
  document.getElementById('btn-del-layer').onclick = () => {
    if (layers.length <= 1) return;
    viewport.removeChild(layers[activeLayerIndex].canvas);
    layers.splice(activeLayerIndex, 1);
    setActiveLayer(Math.max(0, activeLayerIndex - 1));
  };

  // --- Exact Coordinate Calculation Fix ---
  function getCanvasCoordinates(e) {
    const rect = viewport.getBoundingClientRect();
    // Correct mouse cursor position relative to scale and viewport offset
    const x = (e.clientX - rect.left) / scale;
    const y = (e.clientY - rect.top) / scale;
    return { x, y };
  }

  // --- Drawing Logic ---
  function startDraw(e) {
    if (activeLayerIndex < 0) return;

    if (currentTool === 'pan' || e.button === 1 || e.spaceKey) {
      isPanning = true;
      startPanX = e.clientX - panX;
      startPanY = e.clientY - panY;
      return;
    }

    isDrawing = true;
    const pos = getCanvasCoordinates(e);
    lastX = pos.x;
    lastY = pos.y;

    draw(e);
  }

  function draw(e) {
    if (isPanning) {
      panX = e.clientX - startPanX;
      panY = e.clientY - startPanY;
      updateTransform();
      return;
    }

    if (!isDrawing || activeLayerIndex < 0) return;

    const pos = getCanvasCoordinates(e);
    const ctx = layers[activeLayerIndex].ctx;

    const color = document.getElementById('brush-color').value;
    const baseSize = parseFloat(document.getElementById('brush-size').value);
    const opacity = parseFloat(document.getElementById('brush-opacity').value) / 100;
    const usePressure = document.getElementById('enable-pressure').checked;

    // Adjust stroke size dynamically based on Deco Mini 7 V2 pressure
    let currentSize = baseSize;
    if (usePressure && e.pressure && e.pressure > 0) {
      currentSize = baseSize * e.pressure * 1.5;
    }

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);

    if (currentTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = currentSize;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = color;
      ctx.globalAlpha = opacity;
      ctx.lineWidth = currentSize;
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();

    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDraw() {
    isDrawing = false;
    isPanning = false;
  }

  // Pointer Events Binding for Stylus Pressure Support
  container.addEventListener('pointerdown', startDraw);
  container.addEventListener('pointermove', draw);
  window.addEventListener('pointerup', stopDraw);
  window.addEventListener('pointercancel', stopDraw);

  // Zooming Logic (Mouse Wheel)
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const newScale = Math.min(Math.max(0.1, scale * zoomFactor), 5);

    panX = mouseX - (mouseX - panX) * (newScale / scale);
    panY = mouseY - (mouseY - panY) * (newScale / scale);
    scale = newScale;

    updateTransform();
  }, { passive: false });

  // UI Tool Toggle Handlers
  document.getElementById('tool-brush').onclick = function() {
    currentTool = 'brush';
    setActiveToolBtn(this);
  };
  document.getElementById('tool-eraser').onclick = function() {
    currentTool = 'eraser';
    setActiveToolBtn(this);
  };
  document.getElementById('tool-pan').onclick = function() {
    currentTool = 'pan';
    setActiveToolBtn(this);
  };
  document.getElementById('btn-reset-view').onclick = centerCanvas;

  function setActiveToolBtn(btn) {
    document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // Update Slider Value Displays
  document.getElementById('brush-size').oninput = (e) => {
    document.getElementById('val-size').innerText = e.target.value;
  };
  document.getElementById('brush-opacity').oninput = (e) => {
    document.getElementById('val-opacity').innerText = e.target.value;
  };

  // Clear & Export Handlers
  document.getElementById('btn-clear').onclick = () => {
    if (activeLayerIndex >= 0) {
      const ctx = layers[activeLayerIndex].ctx;
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
  };

  document.getElementById('btn-export').onclick = () => {
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = CANVAS_WIDTH;
    exportCanvas.height = CANVAS_HEIGHT;
    const exportCtx = exportCanvas.getContext('2d');

    layers.forEach(layer => {
      if (layer.visible) {
        exportCtx.drawImage(layer.canvas, 0, 0);
      }
    });

    const link = document.createElement('a');
    link.download = 'artwork.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  };

  // Initialize Default Setup
  createLayer('Background');
  centerCanvas();
</script>
</body>
</html>
